name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: backend/global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --warnaserror

      - name: Test
        run: dotnet test --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Check for vulnerable NuGet packages
        run: |
          output="$(dotnet list package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Upload generated OpenAPI document
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-spec
          path: backend/src/CommitAhead.Api/obj/CommitAhead.Api.json
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openapi-spec
          path: ../backend/src/CommitAhead.Api/obj

      - name: Regenerate API client and check for drift
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated || {
            echo "::error::Generated OpenAPI client is out of date — run 'npm run generate:api' in frontend/ and commit the result.";
            exit 1;
          }

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
