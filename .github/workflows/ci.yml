name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Overrides the workflow default, which grants contents only. packages: read is granted here
    # and in combined-artifact because those are the only jobs that restore .NET projects.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: backend/global.json

      - name: Authenticate the private package feed
        # The repository's NuGet.Config declares this source without a credential; the credential
        # goes into the runner's own user-level NuGet configuration, which is where
        # `dotnet nuget update source` writes (verified locally, 2026-08-21) — not into the
        # checkout, so it cannot be committed or uploaded by accident. NuGet merges the two and
        # matches the credential to the source by name, which is why the name must stay
        # "devalente-shared". Fails closed rather than letting restore fall back to a 401 that
        # surfaces as a confusing "package not found". The token is never echoed: it reaches dotnet
        # through the environment only.
        env:
          DEVALENTE_PACKAGES_TOKEN: ${{ secrets.DEVALENTE_PACKAGES_TOKEN }}
        run: |
          if [ -z "${DEVALENTE_PACKAGES_TOKEN}" ]; then
            echo "::error::DEVALENTE_PACKAGES_TOKEN is not configured. See docs/engineering-context.md, 'Private package feed'."
            exit 1
          fi
          dotnet nuget update source devalente-shared --username denisvr --password "${DEVALENTE_PACKAGES_TOKEN}" --store-password-in-clear-text

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --warnaserror

      - name: Test
        run: dotnet test --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Check for vulnerable NuGet packages
        run: |
          output="$(dotnet list package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Upload generated OpenAPI document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: backend/src/CommitAhead.Api/obj/CommitAhead.Api.json
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openapi-spec
          # download-artifact's `path` is resolved relative to GITHUB_WORKSPACE (the repo root),
          # not relative to this job's `defaults.run.working-directory: frontend` — that default
          # only applies to `run:` steps, not `uses:` steps. A leading `../` here walks the
          # artifact right outside the checked-out repo, so `npm run generate:api` (which does run
          # with cwd=frontend/ and looks for ../backend/... from there, landing back at the repo
          # root's backend/) never finds it.
          path: backend/src/CommitAhead.Api/obj

      - name: Regenerate API client and check for drift
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated || {
            echo "::error::Generated OpenAPI client is out of date — run 'npm run generate:api' in frontend/ and commit the result.";
            exit 1;
          }

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  combined-artifact:
    name: Combined artifact (frontend build + backend publish + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: backend/global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Authenticate the private package feed
        # The repository's NuGet.Config declares this source without a credential; the credential
        # goes into the runner's own user-level NuGet configuration, which is where
        # `dotnet nuget update source` writes (verified locally, 2026-08-21) — not into the
        # checkout, so it cannot be committed or uploaded by accident. NuGet merges the two and
        # matches the credential to the source by name, which is why the name must stay
        # "devalente-shared". Fails closed rather than letting restore fall back to a 401 that
        # surfaces as a confusing "package not found". The token is never echoed: it reaches dotnet
        # through the environment only.
        env:
          DEVALENTE_PACKAGES_TOKEN: ${{ secrets.DEVALENTE_PACKAGES_TOKEN }}
        run: |
          if [ -z "${DEVALENTE_PACKAGES_TOKEN}" ]; then
            echo "::error::DEVALENTE_PACKAGES_TOKEN is not configured. See docs/engineering-context.md, 'Private package feed'."
            exit 1
          fi
          dotnet nuget update source devalente-shared --username denisvr --password "${DEVALENTE_PACKAGES_TOKEN}" --store-password-in-clear-text

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish backend
        working-directory: backend
        # Fails if frontend/dist is missing (CopyFrontendBuildToPublishOutput in
        # CommitAhead.Api.csproj) — proves the SPA is actually included, not just built.
        run: dotnet publish src/CommitAhead.Api --configuration Release --output ./publish

      - name: Start published app and verify / and /api/health
        working-directory: backend/publish
        # Must run from inside the publish directory — the generic host defaults ContentRootPath
        # (and so WebRootPath -> wwwroot) to the current working directory, not the DLL's
        # location, so running from anywhere else silently breaks static file / SPA serving.
        run: |
          set -e
          ASPNETCORE_URLS=http://localhost:5199 dotnet ./CommitAhead.Api.dll &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:5199/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Published app never became ready on /api/health"
            exit 1
          fi

          curl -sf http://localhost:5199/api/health | grep -q "Healthy" || {
            echo "::error::/api/health did not report Healthy"
            exit 1
          }
          curl -sf http://localhost:5199/ | grep -qi "<!doctype html>" || {
            echo "::error::/ did not return the SPA shell (frontend/dist not served from wwwroot)"
            exit 1
          }

          unknown_api_status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/api/does-not-exist)"
          [ "$unknown_api_status" = "404" ] || {
            echo "::error::Unmatched /api route returned $unknown_api_status, expected 404"
            exit 1
          }
          unknown_auth_status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/auth/does-not-exist)"
          [ "$unknown_auth_status" = "404" ] || {
            echo "::error::Unmatched /auth route returned $unknown_auth_status, expected 404"
            exit 1
          }
