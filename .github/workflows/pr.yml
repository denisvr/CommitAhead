name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --warnaserror

      - name: Test
        run: dotnet test --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Check for vulnerable NuGet packages
        run: |
          output="$(dotnet list package --vulnerable --include-transitive)"
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CommitAhead.Web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: src/CommitAhead.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/CommitAhead.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
