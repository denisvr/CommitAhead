# CommitAhead E2E reverse proxy — the ONLY host-facing service in the E2E stack (E2E Foundation
# Plan). `app` has no published port and no route off its own internal network (verified
# empirically: an internal-only service ignores `ports:` entirely — `docker port` shows no
# mapping — so a straddling proxy is the only way to keep app egress-isolated while still being
# reachable from the host browser). This file forwards to `app` only; it never proxies anywhere
# else and holds no credentials of its own.
server {
    listen 80;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
