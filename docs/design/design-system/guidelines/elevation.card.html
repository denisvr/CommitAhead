<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}.w{padding:20px 24px}</style></head><body><div class="w"><div style="display:flex;gap:18px">
<div style="text-align:center"><div style="width:170px;height:64px;background:var(--surface);border:1px solid var(--border)"></div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint);margin-top:8px">flat — everything</div></div>
<div style="text-align:center"><div style="width:170px;height:64px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-overlay)"></div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint);margin-top:8px">overlay — dialogs only</div></div>
</div></div></body></html>
