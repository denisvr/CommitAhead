<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Accent</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}.w{padding:20px 24px}</style></head><body><div class="w"><div style="display:flex;gap:12px"><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--accent);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">accent</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#24405C / #8FB4D9</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">10.1:1</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--accent-hover);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">accent-hover</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#16283A / #B0CBE6</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--accent-wash);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">accent-wash</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#E3E8EE / #1C242C</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--accent-contrast);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">accent-contrast</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#FFFDF8 / #12212E</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">7.4:1 on accent</div></div></div></div></body></html>
