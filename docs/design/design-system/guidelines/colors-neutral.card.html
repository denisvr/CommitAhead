<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}.w{padding:20px 24px}</style></head><body><div class="w"><div style="display:flex;gap:10px"><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--bg);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">paper</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#F6F3EC / #171614</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--surface);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">sheet</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#FFFDF8 / #1E1D1A</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--surface-alt);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">tint</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#EDE8DE / #262421</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--text);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">ink</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#1B1A17 / #F0EDE6</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">16.4:1</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--text-muted);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">ink 2</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#55514A / #ABA69B</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">7.5:1</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--text-faint);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">ink 3</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#6E6A5F / #8F897C</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">5.2:1</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--border-strong);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">rule strong</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#8C8578 / #757066</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">3.4:1</div></div></div></div></body></html>
