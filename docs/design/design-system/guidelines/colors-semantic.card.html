<!-- @dsCard group="Colors" viewport="700x190" name="Semantic severity" subtitle="Gap severity and AI drafts only. Colour is always paired with a word." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}.w{padding:20px 24px}</style></head><body><div class="w"><div style="display:flex;gap:12px"><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--critical);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">brick — critical</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#97362B / #D97C6C</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">7.9:1</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--caution);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">ochre — caution</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#7E5A12 / #C79B4E</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">6.5:1</div></div><div style="flex:1"><div style="height:52px;border-radius:var(--radius-xs);background:var(--good);border:1px solid rgba(127,127,127,.22)"></div><div style="margin-top:7px;font-size:11.5px;color:var(--text)">moss — good</div><div style="font:400 10.5px/1.4 var(--font-mono);color:var(--text-faint)">#2F6B45 / #71AE81</div><div style="font:500 10px/1.3 var(--font-mono);color:var(--good);margin-top:3px">6.0:1</div></div></div>
<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:var(--radius-xs);padding:4px 9px;color:var(--critical);background:var(--critical-wash)"><b style="width:6px;height:6px;border-radius:50%;background:var(--critical);display:block"></b>High gap</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:var(--radius-xs);padding:4px 9px;color:var(--caution);background:var(--caution-wash)"><b style="width:6px;height:6px;border-radius:50%;background:var(--caution);display:block"></b>Medium gap</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:var(--radius-xs);padding:4px 9px;color:var(--good);background:var(--good-wash)"><b style="width:6px;height:6px;border-radius:50%;background:var(--good);display:block"></b>Matched</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:var(--radius-xs);padding:4px 9px;color:var(--accent);background:var(--accent-wash)"><b style="width:6px;height:6px;border-radius:50%;background:var(--accent);display:block"></b>Draft — needs your review</span>
</div></div></body></html>
