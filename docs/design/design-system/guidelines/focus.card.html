<!-- @dsCard group="Spacing" viewport="700x150" name="Controls & focus" subtitle="2px accent outline at 2px offset, on everything, in both themes." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Focus</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}.w{padding:20px 24px}</style></head><body><div class="w"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<button style="height:40px;padding:0 18px;border:0;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-contrast);font:600 13.5px var(--font-sans);white-space:nowrap">Start review</button>
<button style="height:40px;padding:0 18px;border:0;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-contrast);font:600 13.5px var(--font-sans);outline:2px solid var(--accent);outline-offset:2px;white-space:nowrap">Focused</button>
<button style="height:40px;padding:0 18px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);font:500 13.5px var(--font-sans);white-space:nowrap">Open item</button>
<button style="height:40px;padding:0 18px;border:1px solid var(--critical);border-radius:var(--radius-sm);background:transparent;color:var(--critical);font:600 13.5px var(--font-sans);white-space:nowrap">Delete item</button>
<button style="height:40px;padding:0 18px;border:0;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-contrast);font:600 13.5px var(--font-sans);opacity:.45;white-space:nowrap">Unavailable</button>
</div></div></body></html>
